    <circle cx="245" cy="265" r="15" />
    <polygon points="245,258 252,263 249,271 241,271 238,263" />
    <line x1="245" y1="258" x2="245" y2="250" />
    <line x1="252" y1="263" x2="259" y2="260" />
    <line x1="249" y1="271" x2="254" y2="277" />
    <line x1="241" y1="271" x2="236" y2="277" />
    <line x1="238" y1="263" x2="231" y2="260" />

