    <circle cx="70" cy="33" r="1.5" fill="currentColor" />
    <path d="M 54,40 Q 60,45 66,40" />

    <!-- Coffee cup with steam -->
    <rect x="135" y="30" width="22" height="18" rx="4" />
    <path d="M 157,34 C 163,34 163,42 157,42" />
    <path d="M 140,25 Q 142,20 140,16" />
    <path d="M 146,25 Q 148,20 146,16" />
    <path d="M 152,25 Q 154,20 152,16" />
    <line x1="130" y1="52" x2="162" y2="52" />

    <!-- Lightbulb -->
