    <circle cx="95" cy="45" r="1.5" />
    <circle cx="185" cy="55" r="1.5" />
    <circle cx="280" cy="40" r="1.5" />
    <circle cx="295" cy="115" r="2" />
    <circle cx="95" cy="140" r="1.5" />
    <circle cx="195" cy="130" r="1.5" />
    <circle cx="300" cy="175" r="1.5" />
    <circle cx="90" cy="225" r="1.5" />
    <circle cx="280" cy="235" r="1.5" />
    <circle cx="195" cy="220" r="2" />
    <circle cx="95" cy="310" r="1.5" />
    <circle cx="205" cy="315" r="1.5" />
    <circle cx="295" cy="340" r="1.5" />
    <circle cx="375" cy="315" r="1.5" />

    <!-- Sparkles (+) -->
    <path d="M 105,75 L 105,85 M 100,80 L 110,80" />
    <path d="M 275,70 L 275,80 M 270,75 L 280,75" />
    <path d="M 205,80 L 205,88 M 201,84 L 209,84" />
    <path d="M 105,265 L 105,273 M 101,269 L 109,269" />
    <path d="M 215,285 L 215,293 M 211,289 L 219,289" />
    <path d="M 305,275 L 305,283 M 301,279 L 309,279" />
    <path d="M 175,370 L 175,378 M 171,374 L 179,374" />
