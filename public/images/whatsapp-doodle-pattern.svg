    <path d="M 330,260 C 330,250 345,245 360,245 C 375,245 385,252 385,262 C 385,272 375,278 362,278 L 354,286 L 355,278 C 342,278 330,272 330,260 Z" />
    <path d="M 357,256 C 354,253 349,255 351,259 L 357,266 L 363,259 C 365,255 360,253 357,256 Z" fill="currentColor" opacity="0.6" />

